[package]
name = "ada-parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Syntax highlighting lexers for about 60 languages, with bat's scopes: ada-md's highlighter"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["syntax-highlighting", "lexer", "highlighting", "tokenizer"]
categories = ["parser-implementations", "text-processing"]

# no syntect types (ADR-40), and no dependencies. ada checks the table against bat's syntax set
# in its own tests, where syntect is a dev-dependency (ADR-43).
[dependencies]

[lints.rust]
unused_variables = "deny"
unused_imports = "deny"

[lints.clippy]
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
