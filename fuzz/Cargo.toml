[package]
name = "ada-md-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
# the terminal the frames are checked on (F-04)
vt100 = "0.18.1"
# the grammars the `make` and `bash` targets check the lexer against (G-002, G-003); already in the tree
syntect = { version = "5.3", default-features = false, features = ["parsing"] }
ada-md = { path = ".." }

[[bin]]
name = "render"
path = "fuzz_targets/render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "print"
path = "fuzz_targets/print.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokens"
path = "fuzz_targets/tokens.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session"
path = "fuzz_targets/session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream"
path = "fuzz_targets/stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "images"
path = "fuzz_targets/images.rs"
test = false
doc = false
bench = false

[[bin]]
name = "probe"
path = "fuzz_targets/probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sixel"
path = "fuzz_targets/sixel.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roots"
path = "fuzz_targets/roots.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diagram"
path = "fuzz_targets/diagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "make"
path = "fuzz_targets/make.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bash"
path = "fuzz_targets/bash.rs"
test = false
doc = false
bench = false

# not part of ada's own build
[workspace]
members = ["."]

