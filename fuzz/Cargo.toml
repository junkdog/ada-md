[package]
name = "ada-md-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui = { version = "0.30", default-features = false }
unicode-segmentation = "1.13"
unicode-width = "0.2"
# the terminal the frames are checked on (F-04)
vt100 = "0.16.2"
ada-md = { path = ".." }

[[bin]]
name = "render"
path = "fuzz_targets/render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session"
path = "fuzz_targets/session.rs"
test = false
doc = false
bench = false

# not part of ada's own build
[workspace]
members = ["."]
