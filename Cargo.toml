[package]
name = "ada-md"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A terminal markdown viewer"
license = "MIT"
readme = "README.md"
exclude = ["ada.jpg", "demo/"]
keywords = ["markdown", "viewer", "terminal", "tui", "pager"]
categories = ["command-line-utilities"]

[lib]
name = "ada"

[[bin]]
name = "ada"
path = "src/main.rs"

[features]
default = ["onig"]
# Oniguruma (C, built with `cc`) for syntect's regexes: 10-25x faster first use per language, 3x
# faster parsing and ~5x less memory than fancy-regex. Without it, highlighting stays pure Rust.
onig = ["syntect/regex-onig", "two-face/syntect-onig"]

[dependencies]
anpa = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
regex = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unused_variables = "deny"
unused_imports = "deny"

[lints.clippy]
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_enum_variant = "warn"
manual_string_new = "warn"
needless_return = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
collection_is_never_read = "warn"
large_types_passed_by_value = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
vec_init_then_push = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
semicolon_if_nothing_returned = "warn"
string_add_assign = "warn"
unused_self = "warn"
