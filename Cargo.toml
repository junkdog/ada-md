[package]
name = "ada-md"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A terminal markdown viewer"
license = "MIT"
readme = "README.md"
exclude = ["ada.jpg", "demo/"]
keywords = ["markdown", "viewer", "terminal", "tui", "pager"]
categories = ["command-line-utilities"]

[lib]
name = "ada"

[[bin]]
name = "ada"
path = "src/main.rs"

[features]
default = ["onig"]
# Oniguruma (C, built with `cc`) for syntect's regexes: 10-25x faster first use per language, 3x
# faster parsing and ~5x less memory than fancy-regex. Without it, highlighting stays pure Rust.
onig = ["syntect/regex-onig", "two-face/syntect-onig"]

[dependencies]
anpa = "0.12"
# Only for `use-dev-tty`: its event source waits with level-triggered poll(2). The default mio one is
# edge-triggered and returns before draining the tty, so input over 1 KB in one burst stalls until the next
# byte arrives, or for good when the writer is blocked on a full tty (crossterm#1142).
crossterm = { version = "0.29", default-features = false, features = ["use-dev-tty"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Already in the tree through image. It decodes a row at a time, so a PNG is shrunk as it decodes
# and never held whole (`pixels`), and it encodes printed kitty images (`kitty`).
png = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
regex = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

# Live reload by inotify (ADR-26), and the image probe's wait for the terminal's replies (CS-2);
# already in the tree through crossterm.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "event"] }

# One glibc malloc arena for the TUI (`mallopt`, ADR-27); already in the tree through crossterm.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.190"

[dev-dependencies]
insta = "1.49"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# unwinding, not abort: `guard::catch` stops a panic in a dependency (F-05)

[lints.rust]
unused_variables = "deny"
unused_imports = "deny"

[lints.clippy]
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_enum_variant = "warn"
manual_string_new = "warn"
needless_return = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
collection_is_never_read = "warn"
large_types_passed_by_value = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
vec_init_then_push = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
semicolon_if_nothing_returned = "warn"
string_add_assign = "warn"
unused_self = "warn"
