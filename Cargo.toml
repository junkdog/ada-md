[package]
name = "ada-md"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal markdown viewer"
license = "MIT"
repository = "https://github.com/junkdog/ada-md"
homepage = "https://junkdog.github.io/ada-md/"
readme = "README.md"
# the tests read bench/diagrams and tests/; bench/order and .cargo are for `cargo ordered` (xtask/), run from the repo
exclude = ["ada.jpg", "demo/", "site/", ".github/", ".githooks/", ".cargo/", "bench/images/", "bench/order/", "cliff.toml", "changelog.zsh"]
keywords = ["markdown", "viewer", "terminal", "tui", "pager"]
categories = ["command-line-utilities"]

[lib]
name = "ada"

[[bin]]
name = "ada"
path = "src/main.rs"

[features]
default = ["onig", "jemalloc"]
# Oniguruma (C, built with `cc`) for syntect's regexes: 10-25x faster first use per language, 3x
# faster parsing and ~5x less memory than fancy-regex. Without it, highlighting stays pure Rust.
onig = ["syntect/regex-onig", "two-face/syntect-onig"]
# jemalloc (C, built with `make`) for musl targets, below; nothing elsewhere.
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
anpa = "0.13"
# `events` for keys and resizes (ratatui turned it on until CS-4); `windows` is the default's, only for
# Windows targets. `use-dev-tty`: its event source waits with level-triggered poll(2). The default mio one is
# edge-triggered and returns before draining the tty, so input over 1 KB in one burst stalls until the next
# byte arrives, or for good when the writer is blocked on a full tty (crossterm#1142).
crossterm = { version = "0.29", default-features = false, features = ["events", "use-dev-tty", "windows"] }
# The highlight cache's key and the slugs' map (PAR-003): about 6× SipHash on code, no
# dependencies of its own.
foldhash = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# Already in the tree through image, as png below: a GIF's first frame is read a row at a time, so
# it's shrunk on its logical screen without the screen held whole (`pixels`).
gif = "0.14"
# Already in the tree through image. It decodes a row at a time, so a PNG is shrunk as it decodes
# and never held whole (`pixels`), and it encodes printed kitty images (`kitty`).
png = "0.18"
# Already in the tree through regex. Code blocks' line counts, and line starts where AVX2 isn't
# (PAR-003).
memchr = "2.8"
pulldown-cmark = { version = "0.13.5", default-features = false }
regex = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

# Live reload by inotify (ADR-26), and the image probe's wait for the terminal's replies (CS-2);
# already in the tree through crossterm.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "event"] }

# One glibc malloc arena for the TUI (`mallopt`, ADR-27); already in the tree through crossterm.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.190"

# Windows' opener, `ShellExecuteW` (WIN-003), and the terminal probe's console input (WIN-006);
# already in the tree through walkdir's winapi-util.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# jemalloc for the static musl binary (REL-22, MEM-09): musl's malloc has one lock for the process,
# and Oniguruma (C) allocates through it on every search, so print's highlighting threads queue on
# it. Unprefixed, it serves C's malloc too, which a Rust allocator alone doesn't.
[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = { version = "0.7.0", optional = true, features = ["unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
insta = "1.49"
# pulldown-cmark's HTML renderer, a reference beside ada's stages in examples/throughput (BEN-009)
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }

# The thread CPU clock the examples share (examples/common), on macOS too.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.190"

# xtask: `cargo ordered`, the release build (.cargo/config.toml). bench/ and fuzz/ hold crates of their
# own, and B2's checkouts of ada (bench/b2/root/build)
[workspace]
members = ["xtask"]
exclude = ["bench", "fuzz"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# unwinding, not abort: `guard::catch` stops a panic in a dependency (F-05)

[lints.rust]
unused_variables = "deny"
unused_imports = "deny"

[lints.clippy]
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_enum_variant = "warn"
manual_string_new = "warn"
needless_return = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
collection_is_never_read = "warn"
large_types_passed_by_value = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
vec_init_then_push = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
semicolon_if_nothing_returned = "warn"
string_add_assign = "warn"
unused_self = "warn"
