[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
rustc-demangle = "0.1.28"
# `names`: bat's syntax set's names, extensions and first-line regexes, read from two-face's dump
# (ADR-43)
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
