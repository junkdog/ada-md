[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
rustc-demangle = "0.1.28"
# `dump`: ada's syntax sets, two-face's with the grammars ada-parse covers emptied (ADR-40);
# bincode as syntect dumps them
ada-parse = { path = "../ada-parse" }
bincode = "1.3.3"
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "dump-create", "regex-fancy"] }
