# The dependency policy (the clean-slate plan's Q3), for `cargo deny check`
# (`cargo install --locked cargo-deny`). Run by hand before a release and after dependency bumps,
# so the tree doesn't grow back.

[advisories]
# RustSec's advisory database: a vulnerable, unsound or unmaintained crate fails the check, and
# so does a yanked one.
version = 2
yanked = "deny"
ignore = []

[licenses]
# What today's tree needs, and no more: every crate offers MIT or Apache-2.0, except foldhash
# (Zlib, through ratatui) and unicode-ident's Unicode data (Unicode-3.0, alongside MIT or Apache).
version = 2
allow = ["MIT", "Apache-2.0", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
# Two versions of one crate warn until the clean-slate plan's CS-3 and CS-4 take ratatui-image
# and ratatui out, with most of today's pairs (2026-10-20): hashbrown 0.16/0.17 (ratatui),
# rand 0.8/0.10, rand_core, rustix 0.38/1 and linux-raw-sys (ratatui-image), thiserror 1/2 and
# syn 2/3 (proc-macros on both sides). miniz_oxide 0.8/0.9 (png and flate2) stays. After CS-4,
# deny, with a `skip` for each pair left.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only
unknown-registry = "deny"
unknown-git = "deny"
