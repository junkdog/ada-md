# The dependency policy (the clean-slate plan's Q3), for `cargo deny check`
# (`cargo install --locked cargo-deny`). Run by hand before a release and after dependency bumps,
# so the tree doesn't grow back.

[advisories]
# RustSec's advisory database: a vulnerable, unsound or unmaintained crate fails the check, and
# so does a yanked one.
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1 unmaintained; syntect 5.3 (the latest) loads two-face's syntax dumps with it, in ada's tests, examples and xtask only (ADR-43): data, not input" },
]

[licenses]
# What today's tree needs, and no more: every crate offers MIT or Apache-2.0, alongside
# unicode-ident's Unicode data (Unicode-3.0).
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
# A second version of a crate fails the check, except the pairs below. Each skip names the older
# version, the one expected to leave; drop it when its pair goes, so a new duplicate fails again.
multiple-versions = "deny"
skip = [
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18 uses it directly; its flate2 has 0.9" },
]
wildcards = "deny"

[sources]
# crates.io only
unknown-registry = "deny"
unknown-git = "deny"
