name: 📦 Release

# Builds the Linux and macOS binaries of a version tag and drafts a GitHub release with them
# (REL-01, REL-03). Pushing a `v*` tag starts it; run it by hand to build an existing tag again,
# with `dry_run` to keep the archives as workflow artifacts and leave the releases alone. A dry run
# also builds any branch or commit, whatever its version (`gh workflow run release.yml -f tag=main
# -f dry_run=true`), to try the jobs before a tag. A tag with a pre-release part (`v1.0.0-rc.1`)
# drafts a pre-release. Publishing the draft, and `cargo publish`, stay manual.
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v1.0.0-rc.1; with dry_run, also a branch or commit
        required: true
      dry_run:
        description: Build only, no release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # a dry run checks out what it's given, a tag, branch or commit; a release only a tag
  REF: ${{ inputs.dry_run && inputs.tag || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
  DRY_RUN: ${{ inputs.dry_run || false }}
  # the release toolchain; bench/order/order.txt's names hold on any (MEM-08)
  RUST_TOOLCHAIN: 1.99.1

jobs:
  version:
    name: 🏷️ Tag and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}
      - name: 🔍 Tag matches Cargo.toml
        id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            if [ "$DRY_RUN" != true ]; then
              echo "::error::tag $TAG doesn't match Cargo.toml's version $version"
              exit 1
            fi
            echo "::notice::dry run of $TAG, Cargo.toml's version $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
      # the release commit runs `git cliff --tag vX.Y.Z -o CHANGELOG.md` (REL-03, REL-23); pre-releases fold into
      # the release after them, so only a release needs its entry
      - name: 📜 CHANGELOG.md has the release
        if: steps.v.outputs.prerelease == 'false'
        run: |
          version=${{ steps.v.outputs.version }}
          if ! grep -qF "## [$version](" CHANGELOG.md; then
            level=error; [ "$DRY_RUN" = true ] && level=warning
            echo "::$level::CHANGELOG.md has no entry for $version: run git cliff --tag v$version -o CHANGELOG.md in the release commit"
            [ "$DRY_RUN" = true ]
          fi

  build:
    name: 🔨 ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35: build.rs skips RELR there, so the binary needs no newer glibc than its
          # symbols do (ADR-34); one built on ubuntu-24.04 wouldn't start on 22.04 or RHEL 9
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # static, for Alpine and any Linux (REL-22): built with --target, onig by musl-tools' musl-gcc
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm, musl: true }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET_ARGS: ${{ matrix.musl && format('--target {0}', matrix.target) || '' }}
      BIN: target/${{ matrix.musl && format('{0}/', matrix.target) || '' }}release/ada
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.musl && matrix.target || '' }}
      # cc looks for aarch64-linux-musl-gcc on aarch64, and musl-tools has only musl-gcc. On aarch64:
      # jemalloc (MEM-09) takes the build machine's page size and refuses to start on a larger one,
      # so 64 KiB, to start on 4, 16 and 64 KiB kernels; and gcc's atomics are inline, as libgcc's
      # outline ones need `__getauxval`, which musl 1.2.2's libc.so doesn't export, so every
      # atomics check in jemalloc's configure (linked dynamically) failed
      - name: 🧰 musl-tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          target=${{ matrix.target }}
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
          if [ "${target%%-*}" = aarch64 ]; then
            echo "JEMALLOC_SYS_WITH_LG_PAGE=16" >> "$GITHUB_ENV"
            echo "CFLAGS_${target//-/_}=-mno-outline-atomics" >> "$GITHUB_ENV"
          fi
      # with the hot code first where lld links (MEM-02, MEM-08): two links, the second with order.txt's names
      # as this build has them; fails when it has under 90% of them (exit 2), and then trace.zsh runs again
      - name: 🔨 Build
        run: |
          report=$(python3 -I bench/order/build.py --locked $TARGET_ARGS) && rc=0 || rc=$?
          echo "$report"
          echo "**Symbol order:** ${report#symbol order: }" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: 🧪 Smoke test
        run: |
          out=$("$BIN" --version)
          [ "$out" = "ada $VERSION" ] || { echo "::error::--version says '$out'"; exit 1; }
          "$BIN" --print --width 80 README.md > /dev/null
      # the versions ld.so insists on: weak ones (flags 0x02, as std's pidfd_spawnp) may be missing,
      # and GLIBC_ABI_DT_RELR (RELR, 2.36+) counts as 2.36
      - name: 📏 glibc floor
        if: runner.os == 'Linux' && !matrix.musl
        run: |
          floor=$(objdump -p "$BIN" \
            | awk '/required from libc\.so/ {f = 1; next} /required from/ {f = 0} f && $2 == "0x00" {print $4}' \
            | sed 's/^GLIBC_ABI_DT_RELR$/GLIBC_2.36/' | sort -uV | tail -1)
          echo "${{ matrix.target }} needs $floor"
          echo "**${{ matrix.target }}:** needs $floor" >> "$GITHUB_STEP_SUMMARY"
          # the floor the README and the release notes promise (REL-01, decided 2026-10-23)
          if [ "$(printf '%s\n' "$floor" GLIBC_2.34 | sort -V | tail -1)" != GLIBC_2.34 ]; then
            echo "::error::$floor is newer than the promised GLIBC_2.34"
            exit 1
          fi
      # a musl binary needs no library at all, so it starts on Alpine and on any glibc
      - name: 📏 Static
        if: matrix.musl
        run: |
          file "$BIN"
          if readelf -d "$BIN" | grep -q NEEDED; then
            echo "::error::$BIN needs a shared library"
            exit 1
          fi
          echo "**${{ matrix.target }}:** static" >> "$GITHUB_STEP_SUMMARY"
      - name: 📦 Package
        run: |
          name=ada-$VERSION-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp "$BIN" README.md LICENSE KNOWN_ISSUES.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ada-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: 🚀 Draft release
    needs: [ version, build ]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # the history and tags, for git-cliff
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      # the release's commits, by cliff.toml (REL-23), which folds pre-releases into the release after them; a
      # pre-release's notes are its own commits, so nothing is folded. The version heading goes: the title has it
      - name: 📝 Release notes
        run: |
          fold=()
          if [ "${{ needs.version.outputs.prerelease }}" = true ]; then fold=(--ignore-tags '^$'); fi
          git cliff --current --strip all "${fold[@]}" | sed '1,/^## /d' > notes.md
          grep -q '^- ' notes.md || echo "No user-facing changes since the last release." > notes.md
          cat notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 🔐 Checksums
        working-directory: dist
        run: sha256sum *.tar.gz | tee SHA256SUMS
      # a run on a tag that already has a release replaces its archives and keeps its text
      - name: 🚀 Draft or update
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            flags=(--draft --verify-tag --title "ada $VERSION" --notes-file notes.md)
            if [ "${{ needs.version.outputs.prerelease }}" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" dist/* "${flags[@]}" -R "$GITHUB_REPOSITORY"
          fi
