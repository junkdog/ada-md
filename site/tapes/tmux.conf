# For resize.tape: no status bar, a quiet border, 24-bit color, and two keys that move the border.
set -g status off
set -g escape-time 0
set -as terminal-features ',xterm*:RGB'
set -g pane-border-style fg=#3c3836
set -g pane-active-border-style fg=#3c3836
bind -n M-h resize-pane -t 0 -L 6
bind -n M-l resize-pane -t 0 -R 6
