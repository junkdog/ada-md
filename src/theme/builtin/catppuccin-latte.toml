# catppuccin latte, after the catppuccin style guide (github.com/catppuccin/catppuccin): headings
# run red → lavender, mauve is the accent, and syntax colors follow its code mapping. It paints
# its own background, `base`, so it reads as latte whatever the terminal's colors.
name = "catppuccin-latte"

[palette]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"

[document]
fg = "text"
bg = "base"
margin = 2

[heading]
1 = { fg = "base", bg = "red", bold = true, prefix = " ", suffix = " " }
2 = { fg = "peach", bold = true, prefix = "## " }
3 = { fg = "yellow", bold = true, prefix = "### " }
4 = { fg = "green", bold = true, prefix = "#### " }
5 = { fg = "sapphire", bold = true, prefix = "##### " }
6 = { fg = "lavender", prefix = "###### " }

[inline]
emph = { fg = "pink", italic = true }
strong = { fg = "peach", bold = true }
strike = { crossed_out = true }
code = { fg = "green", bg = "surface0", pad = 1 }
link = { fg = "blue", underline = true }
link_focused = { fg = "base", bg = "blue" }
link_broken = { fg = "red", crossed_out = true }
image = { fg = "mauve", underline = true }
footnote_ref = { fg = "lavender" }

[block]
quote = { fg = "subtext0" }
quote_bar = { fg = "overlay0" }
callout_note = { fg = "blue", bold = true }
callout_tip = { fg = "green", bold = true }
callout_important = { fg = "mauve", bold = true }
callout_warning = { fg = "yellow", bold = true }
callout_caution = { fg = "red", bold = true }
code = { fg = "text", bg = "mantle" }
code_text = {}
code_label = { fg = "overlay1", bg = "mantle", italic = true }
code_wrap_mark = { fg = "overlay0", bg = "mantle" }
list_bullet = { fg = "overlay2" }
list_number = { fg = "overlay2" }
task_done = { fg = "green" }
task_open = { fg = "overlay1" }
rule = { fg = "overlay0" }
table_border = { fg = "surface2" }
table_header = { fg = "mauve", bold = true }
table_row_alt = { bg = "mantle" }
footnote_label = { fg = "lavender" }
html = { fg = "overlay1" }
image_frame = {}

[glyphs]
bullets = ["•", "◦", "▪"]
quote_bar = "│ "
rule = "─"
table_border = "rounded"
task = ["[✓] ", "[ ] "]
wrap_mark = "↪"
code_clip = ["‹", "›"]
sort_mark = ["▲", "▼"]
image = "🖼 "

[gutter.unstaged]
added = { glyph = "▎", fg = "green" }
modified = { glyph = "▎", fg = "blue" }
deleted = { glyph = "▁", fg = "red" }

[gutter.staged]
added = { glyph = "▎", fg = "teal" }
modified = { glyph = "▎", fg = "mauve" }
deleted = { glyph = "▁", fg = "peach" }

[ui]
status_bar = { fg = "subtext0", bg = "mantle" }
status_file = { fg = "text", bg = "surface0", bold = true }
status_heading = { fg = "mauve", bg = "mantle" }
status_pos = { fg = "subtext0", bg = "surface0" }
status_message = { fg = "yellow", bg = "mantle" }
status_link = { fg = "blue", bg = "mantle" }
search_match = { fg = "base", bg = "peach" }
search_match_hidden = { underline = true, bg = "surface1" }
search_current = { fg = "base", bg = "yellow", bold = true }
prompt = { fg = "text", bg = "mantle" }
prompt_error = { fg = "red", bg = "mantle" }
popup = { fg = "text", bg = "mantle" }
popup_border = { fg = "lavender", bg = "mantle" }
popup_title = { fg = "mauve", bg = "mantle", bold = true }
popup_selected = { fg = "base", bg = "mauve", bold = true }
sort_table = { fg = "mauve" }

[syntax]
"comment" = { fg = "overlay2", italic = true }
"meta.preprocessor" = { fg = "pink" }
"keyword" = { fg = "mauve" }
"storage.type" = { fg = "mauve" }
"storage.modifier" = { fg = "mauve" }
"keyword.operator" = { fg = "sky" }
"punctuation" = { fg = "overlay2" }
"punctuation.definition.string" = { fg = "green" }
"punctuation.definition.comment" = { fg = "overlay2", italic = true }
"variable" = { fg = "text" }
"variable.parameter" = { fg = "maroon" }
"support.function" = { fg = "blue" }
"support.type" = { fg = "yellow" }
"entity.name.tag" = { fg = "blue" }
"entity.other.attribute-name" = { fg = "yellow" }
"entity.name.type" = { fg = "yellow" }
"entity.name.class" = { fg = "yellow" }
"entity.name.function" = { fg = "blue" }
"constant" = { fg = "peach" }
"constant.numeric" = { fg = "peach" }
"string" = { fg = "green" }
"constant.character.escape" = { fg = "pink" }
"markup.deleted" = { fg = "red" }
"markup.inserted" = { fg = "green" }
"markup.italic" = { italic = true }
"markup.bold" = { bold = true }
"markup.heading" = { fg = "blue" }
"invalid" = { fg = "base", bg = "red" }
