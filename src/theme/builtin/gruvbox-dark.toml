# gruvbox dark, after the gruvbox palette (github.com/morhetz/gruvbox). Prose stays cream, and
# color is kept for structure: headings run warm to cool as they drop, and syntax colors follow
# gruvbox's vim mapping. User themes may `extends = "gruvbox-dark"` and override only some keys.
name = "gruvbox-dark"

[palette]
bg0_h = "#1d2021"
bg = "#282828"
bg0_s = "#32302f"
bg1 = "#3c3836"
bg2 = "#504945"
bg3 = "#665c54"
bg4 = "#7c6f64"
fg = "#ebdbb2"
fg0 = "#fbf1c7"
fg2 = "#d5c4a1"
fg4 = "#a89984"
gray = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
purple = "#d3869b"
aqua = "#8ec07c"
orange = "#fe8019"

[document]
fg = "fg"          # bg unset = terminal default
margin = 2

[heading]                    # warm to cool as the levels drop
1 = { fg = "bg", bg = "orange", bold = true, prefix = " ", suffix = " " }
2 = { fg = "orange", bold = true, prefix = "## " }
3 = { fg = "yellow", bold = true, prefix = "### " }
4 = { fg = "aqua", bold = true, prefix = "#### " }
5 = { fg = "blue", bold = true, prefix = "##### " }
6 = { fg = "purple", prefix = "###### " }

[inline]
emph = { fg = "fg2", italic = true }
strong = { fg = "fg0", bold = true }
strike = { fg = "gray", crossed_out = true }
code = { fg = "aqua", bg = "bg1", pad = 1 }
link = { fg = "blue", underline = true }
link_focused = { fg = "bg", bg = "blue" }
link_broken = { fg = "red", crossed_out = true }
image = { fg = "purple", underline = true }
footnote_ref = { fg = "blue" }

[block]
quote = { fg = "fg4" }
quote_bar = { fg = "bg3" }
callout_note = { fg = "blue", bold = true }
callout_tip = { fg = "green", bold = true }
callout_important = { fg = "purple", bold = true }
callout_warning = { fg = "yellow", bold = true }
callout_caution = { fg = "red", bold = true }
code = { fg = "fg", bg = "bg0_s" }
code_text = {}           # code itself; inherits block.code, under the [syntax] colors
code_label = { fg = "gray", bg = "bg0_s", italic = true }
code_wrap_mark = { fg = "gray", bg = "bg0_s" }
list_bullet = { fg = "yellow" }
list_number = { fg = "yellow" }
task_done = { fg = "green" }
task_open = { fg = "gray" }
rule = { fg = "bg3" }
table_border = { fg = "bg3" }
table_header = { fg = "yellow", bold = true }
table_row_alt = { bg = "bg0_s" }   # every other body row or record card
footnote_label = { fg = "blue" }
html = { fg = "gray" }
image_frame = {}         # an image's frame until it has decoded; inherits block.table_border

[glyphs]
bullets = ["•", "◦", "▪"]
quote_bar = "│ "
rule = "─"
table_border = "rounded"     # rounded | ascii | none
task = ["[✓] ", "[ ] "]
wrap_mark = "↪"
code_clip = ["‹", "›"]       # code clipped at the edges when not wrapping (`w`)
sort_mark = ["▲", "▼"]       # on the header of the column a table is sorted by (`s`)
image = "🖼 "

[gutter.unstaged]            # working tree differs from the index
added = { glyph = "▎", fg = "green" }
modified = { glyph = "▎", fg = "blue" }
deleted = { glyph = "▁", fg = "red" }

[gutter.staged]              # index differs from HEAD, working tree matches the index
added = { glyph = "▎", fg = "aqua" }
modified = { glyph = "▎", fg = "purple" }
deleted = { glyph = "▁", fg = "orange" }

[ui]
status_bar = { fg = "fg4", bg = "bg1" }
status_file = { fg = "fg", bg = "bg2", bold = true }
status_heading = { fg = "orange", bg = "bg1" }
status_pos = { fg = "fg4", bg = "bg2" }
status_message = { fg = "yellow", bg = "bg1" }
status_link = { fg = "blue", bg = "bg1" }        # the focused link's target
search_match = { fg = "bg", bg = "orange" }
search_match_hidden = { underline = true, bg = "bg2" }   # matched in a link target
search_current = { fg = "bg", bg = "yellow", bold = true }
prompt = { fg = "fg", bg = "bg1" }
prompt_error = { fg = "red", bg = "bg1" }
popup = { fg = "fg", bg = "bg1" }               # the outline
popup_border = { fg = "bg3", bg = "bg1" }
popup_title = { fg = "orange", bg = "bg1", bold = true }
popup_selected = { fg = "bg", bg = "orange", bold = true }
sort_table = { fg = "orange" }                  # the borders and header of the table `s` sorts
line_number = { fg = "bg4" }                    # line numbers (`#`)

[syntax]                     # TextMate scope selector → style; the most specific match wins
"comment" = { fg = "gray", italic = true }
"meta.preprocessor" = { fg = "aqua" }
"meta.annotation" = { fg = "aqua" }
"variable.annotation" = { fg = "aqua" }
"keyword" = { fg = "red" }
"keyword.operator" = { fg = "orange" }
"storage" = { fg = "red" }
"storage.type" = { fg = "yellow" }           # u32, int; also rust's `let`, which shares the scope
"storage.type.function" = { fg = "red" }     # fn, struct, impl, …: keywords, not types
"storage.type.struct" = { fg = "red" }
"storage.type.enum" = { fg = "red" }
"storage.type.union" = { fg = "red" }
"storage.type.trait" = { fg = "red" }
"storage.type.impl" = { fg = "red" }
"storage.type.type" = { fg = "red" }
"storage.type.module" = { fg = "red" }
"storage.type.class" = { fg = "red" }
"storage.type.interface" = { fg = "red" }
"storage.modifier.lifetime" = { fg = "orange" }
"punctuation" = { fg = "fg" }
"punctuation.definition.string" = { fg = "green" }
"punctuation.definition.comment" = { fg = "gray", italic = true }
"variable" = { fg = "fg" }
"support.function" = { fg = "aqua" }
"support.macro" = { fg = "aqua" }
"support.type" = { fg = "yellow" }
"entity.name" = { fg = "yellow" }            # struct, enum, trait and class names
"entity.name.function" = { fg = "green", bold = true }
"entity.name.tag" = { fg = "blue" }          # html tags, toml and yaml keys
"entity.name.table" = { fg = "yellow", bold = true }
"entity.other.attribute-name" = { fg = "aqua" }
"constant" = { fg = "purple" }
"constant.numeric" = { fg = "purple" }
"string" = { fg = "green" }
"constant.character.escape" = { fg = "orange" }
"constant.other.placeholder" = { fg = "orange" }
"markup.deleted" = { fg = "red" }
"markup.inserted" = { fg = "green" }
"markup.italic" = { italic = true }
"markup.bold" = { bold = true }
"markup.heading" = { fg = "orange", bold = true }
"invalid" = { fg = "fg0", bg = "red" }
