# git-cliff: the raw list of user-facing commits that CHANGELOG.md's next section is written from by hand
# (REL-024; from 1.1 on, CHANGELOG.md and the release notes aren't generated). Nothing before v1.0.0-rc.1.
# A commit's type and scope decide whether it shows: feat, fix and perf do, docs unscoped or as docs(readme);
# the bench, site and fuzz scopes, ci, chore, test, refactor, style and build don't. So a subject that shows
# reads as what a user notices.
# changelog.zsh runs it: a pre-release folds into its release, and which tags fold depends on the tags there
# are, so it's worked out there (--ignore-tags) rather than here.
#   ./changelog.zsh v1.1.0 --unreleased --strip all   # everything since 1.0.0, the 1.1.0 rcs included

[changelog]
body = """
{%- macro entry(commit) -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}
{%- if commit.breaking and commit.breaking_description != commit.message %}: {{ commit.breaking_description }}{% endif %}
{%- endmacro %}
{% if version -%}
{#- with rc.1 skipped, 1.0.0 has no previous release: it compares to rc.1 #}
{%- if previous.version %}{% set from = previous.version %}{% else %}{% set from = "v1.0.0-rc.1" %}{% endif -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/junkdog/ada-md/compare/{{ from }}..{{ version }}) \
({{ timestamp | date(format="%Y-%m-%d") }})
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{%- for commit in commits %}{% if not commit.scope %}
{{ self::entry(commit=commit) }}
{%- endif %}{% endfor %}
{% endfor -%}
"""
# untrimmed: the template places every newline
trim = false

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = '^[a-z]+\((bench|site|fuzz)\)', skip = true },
  # a breaking change shows whatever its type
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = '^feat', group = "<!-- 1 -->Features" },
  { message = '^fix', group = "<!-- 2 -->Fixes" },
  { message = '^perf', group = "<!-- 3 -->Performance" },
  { message = '^docs(\(readme\))?:', group = "<!-- 4 -->Documentation" },
  { message = '.*', skip = true },
]
tag_pattern = "^v[0-9]"
# rc.1's commits are the whole history before it: dropped, and the footer stands in for its entry
skip_tags = '^v1\.0\.0-rc\.1$'
# no ignore_tags: changelog.zsh folds a released version's pre-releases into it
# newest first; in a group the template sorts by scope (stable, so newest first within one), unscoped last
sort_commits = "newest"
