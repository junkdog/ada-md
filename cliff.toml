# git-cliff: CHANGELOG.md and the release notes, from the commit subjects (REL-23). Nothing before v1.0.0-rc.1:
# its notes, the feature summary, are the first release's. A commit's type and scope decide whether it shows:
# feat, fix and perf do, docs unscoped or as docs(readme); the bench, site and fuzz scopes, ci, chore, test,
# refactor, style and build don't. So a subject that shows is written for users.
#   git cliff --tag v1.0.0 -o CHANGELOG.md   # the release commit: the changelog with the new version
#   git cliff --current --strip all          # a release's notes (the release workflow)
#   git cliff --current --strip all --ignore-tags '^$'   # a pre-release's own notes

[changelog]
header = """
# Changelog

What changed in each release of ada, newest first. A release includes the changes of the pre-releases before it."""
body = """
{%- macro entry(commit) -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}
{%- if commit.breaking and commit.breaking_description != commit.message %}: {{ commit.breaking_description }}{% endif %}
{%- endmacro %}
{% if version -%}
{#- with rc.1 skipped, 1.0.0 has no previous release: it compares to rc.1 #}
{%- if previous.version %}{% set from = previous.version %}{% else %}{% set from = "v1.0.0-rc.1" %}{% endif -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/junkdog/ada-md/compare/{{ from }}..{{ version }}) \
({{ timestamp | date(format="%Y-%m-%d") }})
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{%- for commit in commits %}{% if not commit.scope %}
{{ self::entry(commit=commit) }}
{%- endif %}{% endfor %}
{% endfor -%}
"""
# rc.1, the first release, where it falls (the oldest, last): its notes summarize the features
footer = """

## 1.0.0-rc.1 (2026-10-23)

The first release: its [release notes](https://github.com/junkdog/ada-md/releases/tag/v1.0.0-rc.1) list the features
it shipped with."""
# untrimmed: the templates place every newline. Each release starts with the blank line before it, so the file
# ends with one newline
trim = false

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = '^[a-z]+\((bench|site|fuzz)\)', skip = true },
  # a breaking change shows whatever its type
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = '^feat', group = "<!-- 1 -->Features" },
  { message = '^fix', group = "<!-- 2 -->Fixes" },
  { message = '^perf', group = "<!-- 3 -->Performance" },
  { message = '^docs(\(readme\))?:', group = "<!-- 4 -->Documentation" },
  { message = '.*', skip = true },
]
tag_pattern = "^v[0-9]"
# rc.1's commits are the whole history before it: dropped, and the footer stands in for its entry
skip_tags = '^v1\.0\.0-rc\.1$'
# later pre-releases fold into the release that follows them, as git-cliff's own changelog does (a pre-release's own
# notes: --ignore-tags '^$')
ignore_tags = '-rc\.[0-9]+$'
# newest first; in a group the template sorts by scope (stable, so newest first within one), unscoped last
sort_commits = "newest"
